[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smartattend"
version = "0.1.0"
description = "Smart Attendance and Classroom Engagement Analyzer"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.8",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "pandas>=2.0",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
vision = ["torch>=2.2", "torchvision>=0.17", "ultralytics>=8.2"]
app = ["streamlit>=1.35"]
dev = ["pytest>=8.0"]

[project.scripts]
smartattend = "smartattend.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
