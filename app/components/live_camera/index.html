<!doctype html>
<!--
  Live camera for the Smart Attendance app (a Streamlit custom component, no build step).
  The browser plays the camera itself, so the preview is as smooth as a local camera. In the background it sends
  one JPEG frame at a time to the app; when the app has processed it (args.ack == id of that frame) the next one
  is sent, so the frame rate adapts to the server's speed. The app returns face boxes with names, drawn here on
  top of the live video. Everything goes over Streamlit's own connection, so it works on any network.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; font-family: "Source Sans Pro", "Segoe UI", sans-serif; background: transparent; }
  #wrap { position: relative; width: 100%; background: #111; border-radius: 8px; overflow: hidden; min-height: 60px; }
  video { display: block; width: 100%; height: auto; }
  #ov { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; }
  #bar { display: flex; gap: 12px; align-items: center; margin-top: 8px; }
  button { font: inherit; font-size: 15px; padding: 6px 16px; border-radius: 8px; border: 1px solid #c33;
           background: #d33; color: #fff; cursor: pointer; }
  button.off { background: #fff; color: #333; border-color: #999; }
  #msg { font-size: 14px; color: #888; }
</style>
</head>
<body>
<div id="wrap"><video id="v" autoplay playsinline muted></video><canvas id="ov"></canvas></div>
<div id="bar"><button id="btn">Stop camera</button><span id="msg">Starting the camera... allow camera access if the browser asks.</span></div>
<canvas id="cap" style="display:none"></canvas>
<script>
  const post = (type, data) => window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type }, data), "*");
  const setHeight = () => post("streamlit:setFrameHeight", { height: document.body.scrollHeight });
  const v = document.getElementById("v"), ov = document.getElementById("ov"), cap = document.getElementById("cap");
  const btn = document.getElementById("btn"), msg = document.getElementById("msg");
  const session = Date.now().toString(36);          // frame ids are unique even after a page reload
  let args = {}, started = false, running = false, seq = 0, inflight = null, sentAt = 0, stream = null;

  function drawBoxes() {
    ov.width = v.clientWidth; ov.height = v.clientHeight;
    const g = ov.getContext("2d");
    g.clearRect(0, 0, ov.width, ov.height);
    if (!running || !args.frame_w) return;
    const sx = ov.width / args.frame_w, sy = ov.height / args.frame_h;
    g.font = "bold 15px sans-serif"; g.lineWidth = 3;
    for (const b of (args.boxes || [])) {
      const x = b.x * sx, y = b.y * sy, w = b.w * sx, h = b.h * sy;
      g.strokeStyle = b.color; g.strokeRect(x, y, w, h);
      const tw = g.measureText(b.text).width + 10, ty = Math.max(0, y - 24);
      g.fillStyle = b.color; g.fillRect(x - 1.5, ty, Math.max(tw, w + 3), 24);
      g.fillStyle = "#fff"; g.fillText(b.text, x + 4, ty + 17);
    }
  }

  function sendFrame() {
    if (!running || !v.videoWidth) return;
    // one frame in flight at a time; resend if the app has not answered for 4 s (e.g. it was restarting)
    if (inflight !== null && args.ack !== inflight && Date.now() - sentAt < 4000) return;
    const W = Math.min(args.capture_width || 640, v.videoWidth), H = Math.round(W * v.videoHeight / v.videoWidth);
    cap.width = W; cap.height = H;
    cap.getContext("2d").drawImage(v, 0, 0, W, H);
    seq += 1; inflight = session + "-" + seq; sentAt = Date.now();
    post("streamlit:setComponentValue", { value: { id: inflight, image: cap.toDataURL("image/jpeg", 0.8) },
                                         dataType: "json" });
  }

  function startCamera() {
    msg.textContent = "Starting the camera... allow camera access if the browser asks.";
    navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 640 }, height: { ideal: 480 } }, audio: false })
      .then(s => { stream = s; v.srcObject = s; return v.play(); })
      .then(() => { running = true; msg.textContent = ""; btn.textContent = "Stop camera"; btn.className = "";
                    setHeight(); sendFrame(); })
      .catch(e => { running = false; btn.textContent = "Start camera"; btn.className = "off";
                    msg.textContent = "Camera not available (" + e.name + "). Allow camera access: click the " +
                                      "camera or lock icon in the address bar, then Start camera."; setHeight(); });
  }

  function stopCamera() {
    running = false; inflight = null;
    if (stream) stream.getTracks().forEach(t => t.stop());
    v.srcObject = null; btn.textContent = "Start camera"; btn.className = "off";
    msg.textContent = "Camera stopped."; drawBoxes(); setHeight();
  }

  btn.addEventListener("click", () => (running ? stopCamera() : startCamera()));
  v.addEventListener("loadedmetadata", () => { setHeight(); drawBoxes(); });
  new ResizeObserver(() => { setHeight(); drawBoxes(); }).observe(document.body);
  setInterval(sendFrame, 250);                       // also recovers if an answer was lost

  window.addEventListener("message", e => {
    if (!e.data || e.data.type !== "streamlit:render") return;
    args = e.data.args || {};
    btn.style.display = args.controls === false ? "none" : "";   // the app's own "Camera on" switch controls it
    if (!started) { started = true; startCamera(); }
    drawBoxes();
    if (args.ack === inflight) sendFrame();          // the app has processed our frame: send the next at once
  });
  post("streamlit:componentReady", { apiVersion: 1 });
  setHeight();
</script>
</body>
</html>
